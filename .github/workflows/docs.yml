name: Documentation and specification integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/validate_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes @fission-ai/openspec@1.13.1 validate establish-v1-plugin --strict --no-interactive
